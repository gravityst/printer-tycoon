<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printer Tycoon</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5; color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #1a1a1a; color: #fff;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
  header .stats { display: flex; gap: 24px; margin-left: auto; font-size: 14px; font-weight: 600; }
  header .stat-label { color: #888; font-weight: 500; margin-right: 6px; }
  header .stat-money { color: #4ade80; }
  header .stat-rep { color: #fbbf24; }
  header .controls { display: flex; gap: 8px; }
  header button {
    background: #2a2a2a; color: #fff; border: 1px solid #3a3a3a;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  header button:hover { background: #3a3a3a; }
  header button.danger { color: #f87171; }

  main {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.9fr;
    gap: 16px;
    padding: 16px;
    max-width: 1600px; margin: 0 auto;
  }
  section {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  section h2 {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: #888; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  section h2 .count { font-size: 11px; color: #aaa; font-weight: 500; }
  .shop-btn {
    background: #4ade80; color: #052e16; border: none;
    padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: inherit; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .shop-btn:hover { background: #22c55e; }

  /* ---- Printer card ---- */
  .printer-card {
    border: 1px solid #e5e7eb; border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    background: #fff;
  }
  .printer-card.printing { border-color: #fcd34d; box-shadow: 0 0 0 2px rgba(252,211,77,0.3); }
  .printer-canvas {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(180deg, #e0e7ff 0%, #f3f4f6 70%, #d1d5db 100%);
    border-bottom: 1px solid #e5e7eb;
  }
  .printer-info { padding: 12px 14px; }
  .printer-name {
    font-size: 15px; line-height: 1.3;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .printer-name .brand { color: #6b7280; font-weight: 500; font-size: 13px; }
  .printer-name strong { font-weight: 700; color: #111; }
  .printer-tier {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
    background: #e5e7eb; color: #555; letter-spacing: 0.5px;
  }
  .printer-tier.garage { background: #fee2e2; color: #b91c1c; }
  .printer-tier.hobbyist { background: #fed7aa; color: #c2410c; }
  .printer-tier.studio { background: #fef3c7; color: #a16207; }
  .printer-tier.pro { background: #dbeafe; color: #1d4ed8; }
  .printer-tier.industrial { background: #ddd6fe; color: #6d28d9; }
  .printer-tier.endgame { background: #1a1a1a; color: #fbbf24; }

  .printer-specs { font-size: 11px; color: #6b7280; margin-top: 4px; }
  .printer-status { margin-top: 8px; font-size: 13px; color: #1a1a1a; }
  .printer-status.idle { color: #9ca3af; font-style: italic; }
  .progress {
    margin-top: 8px;
    height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden;
  }
  .progress .fill { height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 0.3s; }
  .job-info { font-size: 12px; color: #555; margin-top: 6px; display: flex; justify-content: space-between; }

  .printer-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .meta-pill {
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    background: #f3f4f6; color: #475569;
  }
  .meta-pill .hardened { color: #b91c1c; font-weight: 700; }
  .meta-pill.resale { background: #ecfdf5; color: #047857; }

  .printer-actions { margin-top: 10px; display: flex; gap: 6px; }
  .printer-manage-btn {
    flex: 1; padding: 7px 10px; font-size: 11px; font-weight: 700;
    border: 1px solid #d1d5db; border-radius: 6px;
    background: #fff; color: #1a1a1a; cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .printer-manage-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* Manage modal — single printer detail + nozzle picker + sell */
  .manage-card {
    inset: 5% 8% !important;
    max-width: 760px;
    margin: 0 auto;
  }
  .manage-body {
    flex: 1; overflow-y: auto;
  }
  .manage-section {
    padding: 16px 24px;
    border-bottom: 1px solid #e5e7eb;
  }
  .manage-section h3 {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: #888; margin-bottom: 10px;
  }
  .manage-section h3 .muted { font-weight: 500; color: #aaa; text-transform: none; letter-spacing: 0; }
  .manage-stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; padding: 4px 0;
  }
  .manage-stat-label { color: #6b7280; }
  .manage-stat-value { font-weight: 600; color: #111; }
  .manage-stat-value .muted { color: #9ca3af; font-weight: 500; font-size: 11px; margin-left: 4px; }

  .nozzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .nozzle-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px;
    background: #fff;
    display: flex; flex-direction: column; gap: 4px;
  }
  .nozzle-card.current {
    border-color: #4ade80;
    background: #f0fdf4;
  }
  .nozzle-name { font-weight: 700; font-size: 13px; color: #111; }
  .nozzle-desc { font-size: 11px; color: #6b7280; }
  .nozzle-effects { font-size: 11px; color: #475569; font-family: ui-monospace, monospace; }
  .nozzle-current { font-size: 11px; color: #047857; font-weight: 700; margin-top: 4px; }
  .nozzle-buy {
    margin-top: 4px;
    padding: 6px 12px; font-size: 11px; font-weight: 700;
    background: #1a1a1a; color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .nozzle-buy:hover:not(:disabled) { background: #4ade80; color: #052e16; }
  .nozzle-buy:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

  .sell-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .sell-info { flex: 1; min-width: 0; }
  .sell-price-display { font-size: 32px; font-weight: 800; color: #111; line-height: 1; }
  .sell-meta { font-size: 12px; color: #4b5563; margin-top: 4px; }
  .sell-meta .sep { color: #d1d5db; margin: 0 4px; }
  .sell-meta.muted { color: #9ca3af; font-size: 11px; }
  .sell-button {
    padding: 12px 26px; font-size: 13px; font-weight: 800;
    background: #b91c1c; color: white; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .sell-button:hover:not(:disabled) { background: #991b1b; }
  .sell-button:disabled {
    background: #e5e7eb; color: #9ca3af; cursor: not-allowed;
  }
  .modal-header .subtitle .brand { color: #6b7280; font-weight: 500; }

  /* ---- Order card ---- */
  .order-card {
    border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
    background: #fafafa;
    transition: background 0.15s;
  }
  .order-card:hover { background: #f3f4f6; }
  .order-name { font-weight: 700; font-size: 14px; }
  .order-cat {
    display: inline-block; font-size: 10px;
    padding: 2px 6px; border-radius: 4px;
    background: #ede9fe; color: #6d28d9; margin-left: 6px; font-weight: 600;
  }
  .order-spec { font-size: 12px; color: #666; margin-top: 3px; }
  .order-pay { font-size: 13px; color: #16a34a; font-weight: 700; margin-top: 6px; }
  .order-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .order-actions button {
    flex: 1; min-width: 0; padding: 8px 10px; font-size: 12px; font-weight: 600;
    border: 1px solid #d1d5db; border-radius: 6px;
    background: #fff; color: #1a1a1a; cursor: pointer; font-family: inherit;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .order-actions button:hover:not(:disabled) { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .order-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .order-actions button.reject { color: #b91c1c; flex: 0 0 auto; padding: 8px 12px; }
  .order-actions button.reject:hover:not(:disabled) { background: #b91c1c; color: #fff; border-color: #b91c1c; }
  .order-deadline { font-size: 11px; color: #888; margin-top: 4px; }
  .order-deadline.urgent { color: #b91c1c; font-weight: 600; }

  /* ---- Material card ---- */
  .mat-card {
    border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: #fafafa;
  }
  .mat-info { flex: 1; min-width: 0; }
  .mat-name { font-weight: 600; font-size: 13px; }
  .mat-stock { font-size: 11px; color: #888; }
  .mat-buy {
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    border: 1px solid #d1d5db; border-radius: 5px;
    background: #fff; color: #1a1a1a; cursor: pointer; font-family: inherit;
    flex-shrink: 0;
  }
  .mat-buy:hover:not(:disabled) { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .mat-buy:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty { color: #aaa; font-size: 13px; font-style: italic; padding: 16px 0; text-align: center; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }
  .toast.success { background: #16a34a; }
  .toast.error { background: #b91c1c; }

  /* ---- Shop modal: simple LIST view ---- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: none;
  }
  .modal.open { display: block; }
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .modal-card {
    position: absolute;
    inset: 4% 5%;
    background: #f8fafc; border-radius: 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }
  @media (max-width: 768px) {
    .modal-card { inset: 0; border-radius: 0; }
  }
  .modal-header {
    padding: 16px 24px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 16px;
  }
  .modal-header h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .modal-header .subtitle { font-size: 12px; color: #888; margin-top: 2px; font-weight: 500; }
  .modal-header .close {
    margin-left: auto;
    width: 36px; height: 36px;
    border-radius: 50%; border: none;
    background: #f3f4f6; color: #666;
    font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit;
    font-weight: 400;
  }
  .modal-header .close:hover { background: #e5e7eb; color: #111; }

  .shop-filters {
    padding: 12px 24px; background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .shop-filters button {
    padding: 6px 14px; font-size: 12px; font-weight: 600;
    background: #f3f4f6; color: #555; border: 1px solid transparent;
    border-radius: 999px; cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .shop-filters button:hover { background: #e5e7eb; }
  .shop-filters button.active { background: #1a1a1a; color: #fff; }

  .shop-list {
    flex: 1; overflow-y: auto;
    padding: 16px 24px 24px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .shop-row {
    background: #fff;
    border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .shop-row:hover { border-color: #4ade80; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  .shop-row.locked { opacity: 0.55; }

  .shop-icon {
    width: 56px; height: 56px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; line-height: 1;
    color: #fff;
    flex-shrink: 0;
  }
  .shop-icon.fdm { background: linear-gradient(135deg, #4b5563, #1f2937); }
  .shop-icon.resin { background: linear-gradient(135deg, #a855f7, #6d28d9); }
  .shop-icon.industrial { background: linear-gradient(135deg, #475569, #0f172a); }

  .shop-row-info { min-width: 0; overflow: hidden; }
  .shop-row-line1 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .shop-row-line1 .brand {
    font-size: 11px; font-weight: 700; color: #6b7280;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .shop-row-line1 .model {
    font-size: 17px; font-weight: 800; color: #111;
    letter-spacing: -0.3px;
  }
  .shop-row-line2 {
    font-size: 12px; color: #6b7280; line-height: 1.4;
  }
  .shop-row-line2 .sep { color: #d1d5db; margin: 0 6px; }
  .shop-row-line3 {
    margin-top: 6px;
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .mat-pill {
    font-size: 10px; font-weight: 600; padding: 2px 6px;
    background: #f3f4f6; color: #555; border-radius: 4px;
  }

  .shop-row-action {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    flex-shrink: 0;
    min-width: 130px;
  }
  .shop-price { font-size: 20px; font-weight: 800; color: #111; line-height: 1; }
  .shop-price .currency { font-size: 13px; color: #6b7280; font-weight: 600; }
  .shop-buy {
    padding: 8px 18px; font-size: 12px; font-weight: 700;
    background: #1a1a1a; color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .shop-buy:hover:not(:disabled) { background: #4ade80; color: #052e16; }
  .shop-buy:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
  .shop-buy.affordable { background: #4ade80; color: #052e16; }
  .shop-buy.affordable:hover { background: #22c55e; }

  @media (max-width: 1024px) {
    main { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .shop-row { grid-template-columns: 48px 1fr; }
    .shop-row-action { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; min-width: 0; }
  }
</style>

<!-- Three.js for 3D printer rendering -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  window.THREE = THREE;
  window.dispatchEvent(new Event('threeReady'));
</script>
</head>
<body>
<header>
  <div class="brand">Printer Tycoon</div>
  <div class="stats">
    <div><span class="stat-label">Cash</span><span class="stat-money">$<span id="money">0</span></span></div>
    <div><span class="stat-label">Day</span><span id="day">1</span> · <span id="hour">08:00</span></div>
    <div><span class="stat-label">Rep</span><span class="stat-rep" id="rep">0</span></div>
    <div><span class="stat-label">Shipped</span><span id="shipped">0</span></div>
  </div>
  <div class="controls">
    <button id="btnSpeed">1x</button>
    <button id="btnReset" class="danger">Reset</button>
  </div>
</header>
<main>
  <section>
    <h2>
      Workshop <span class="count" id="printerCount"></span>
      <button class="shop-btn" onclick="window.openShop()">+ Buy Printer</button>
    </h2>
    <div id="printers"></div>
  </section>
  <section>
    <h2>Incoming Orders <span class="count" id="orderCount"></span></h2>
    <div id="orders"></div>
  </section>
  <section>
    <h2>Filament &amp; Resin</h2>
    <div id="inventory"></div>
  </section>
</main>

<div class="modal" id="manageModal">
  <div class="modal-overlay" onclick="window.closeManage()"></div>
  <div class="modal-card manage-card">
    <div class="modal-header">
      <div>
        <h2>Manage Printer</h2>
        <div class="subtitle" id="manageSubtitle">—</div>
      </div>
      <button class="close" onclick="window.closeManage()">×</button>
    </div>
    <div class="manage-body" id="manageBody"></div>
  </div>
</div>

<div class="modal" id="shopModal">
  <div class="modal-overlay" onclick="window.closeShop()"></div>
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2>Printer Shop</h2>
        <div class="subtitle">Real machines, real prices</div>
      </div>
      <button class="close" onclick="window.closeShop()">×</button>
    </div>
    <div class="shop-filters" id="shopFilters">
      <button class="active" data-filter="all" onclick="window.setShopFilter('all')">All</button>
      <button data-filter="garage" onclick="window.setShopFilter('garage')">Garage</button>
      <button data-filter="hobbyist" onclick="window.setShopFilter('hobbyist')">Hobbyist</button>
      <button data-filter="studio" onclick="window.setShopFilter('studio')">Studio</button>
      <button data-filter="pro" onclick="window.setShopFilter('pro')">Pro</button>
      <button data-filter="industrial" onclick="window.setShopFilter('industrial')">Industrial</button>
      <button data-filter="endgame" onclick="window.setShopFilter('endgame')">Endgame</button>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="game.js"></script>
</body>
</html>
