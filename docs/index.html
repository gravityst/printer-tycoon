<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Print3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg-base: #08080c;
    --bg-panel: #14141b;
    --bg-card: #1a1a23;
    --bg-card-hover: #20202a;
    --bg-input: #0e0e14;
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --border: #2a2a35;
    --border-strong: #3a3a47;
    --accent: #ef4444;
    --accent-bright: #dc2626;
    --accent-dim: #7f1d1d;
    --accent-glow: rgba(239,68,68,0.35);
    --good: #10b981;
    --warn: #fbbf24;
    --bad: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-base); color: var(--text-primary);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(180deg, #1a1a23 0%, #14141b 100%);
    color: var(--text-primary);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 32px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  header .brand {
    font-weight: 900; font-size: 22px; letter-spacing: -0.8px;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent-glow);
  }
  header .stats { display: flex; gap: 24px; margin-left: auto; font-size: 14px; font-weight: 600; }
  header .stat-label { color: var(--text-muted); font-weight: 500; margin-right: 6px; }
  header .stat-money { color: var(--good); }
  header .stat-rep { color: var(--warn); }
  header .controls { display: flex; gap: 8px; }
  header button {
    background: #1f1f29; color: var(--text-primary); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  header button:hover { background: #2a2a35; border-color: var(--border-strong); }
  header button.danger { color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.9fr;
    gap: 16px;
    padding: 16px;
    max-width: 1600px; margin: 0 auto;
  }
  section {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  section h2 {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  section h2 .count { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .shop-btn {
    background: var(--accent); color: white; border: none;
    padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: inherit; letter-spacing: 0.5px;
    text-transform: uppercase; box-shadow: 0 0 12px var(--accent-glow);
  }
  .shop-btn:hover { background: var(--accent-bright); }

  /* ---- Printer card ---- */
  .printer-card {
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    background: var(--bg-card);
  }
  .printer-card.printing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .printer-canvas {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(180deg, #1a1a23 0%, #14141b 70%, #08080c 100%);
    border-bottom: 1px solid var(--border);
  }
  .printer-info { padding: 12px 14px; }
  .printer-name {
    font-size: 15px; line-height: 1.3;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .printer-name .brand { color: var(--text-secondary); font-weight: 500; font-size: 13px; }
  .printer-name strong { font-weight: 700; color: var(--text-primary); }
  .printer-tier {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
    background: #e5e7eb; color: #555; letter-spacing: 0.5px;
  }
  .printer-tier.garage { background: #fee2e2; color: #b91c1c; }
  .printer-tier.hobbyist { background: #fed7aa; color: #c2410c; }
  .printer-tier.studio { background: #fef3c7; color: #a16207; }
  .printer-tier.pro { background: #dbeafe; color: #1d4ed8; }
  .printer-tier.industrial { background: #ddd6fe; color: #6d28d9; }
  .printer-tier.endgame { background: #1a1a1a; color: #fbbf24; }

  .printer-specs { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .printer-status { margin-top: 8px; font-size: 13px; color: var(--text-primary); }
  .printer-status.idle { color: var(--text-muted); font-style: italic; }
  .progress {
    margin-top: 8px;
    height: 8px; background: #0a0a10; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); transition: width 0.3s; box-shadow: 0 0 8px var(--accent-glow); }
  .job-info { font-size: 12px; color: var(--text-secondary); margin-top: 6px; display: flex; justify-content: space-between; }

  .printer-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .meta-pill {
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    background: #0e0e14; color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .meta-pill .hardened { color: var(--accent); font-weight: 700; }
  .meta-pill.resale { background: rgba(16,185,129,0.12); color: var(--good); border-color: rgba(16,185,129,0.3); }

  .printer-actions { margin-top: 10px; display: flex; gap: 6px; }
  .printer-manage-btn {
    flex: 1; padding: 7px 10px; font-size: 11px; font-weight: 700;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-input); color: var(--text-primary); cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .printer-manage-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

  /* Manage modal — single printer detail + nozzle picker + sell */
  .manage-card {
    inset: 5% 8% !important;
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg-base);
  }
  .manage-body {
    flex: 1; overflow-y: auto;
    background: var(--bg-base);
  }
  .manage-section {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .manage-section h3 {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 10px;
  }
  .manage-section h3 .muted { font-weight: 500; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
  .manage-stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; padding: 4px 0;
  }
  .manage-stat-label { color: var(--text-secondary); }
  .manage-stat-value { font-weight: 600; color: var(--text-primary); }
  .manage-stat-value .muted { color: var(--text-muted); font-weight: 500; font-size: 11px; margin-left: 4px; }

  /* Compatible-materials chip grid in Manage modal */
  .mat-chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .mat-chip {
    padding: 5px 10px; border-radius: 999px;
    background: var(--bg-card); color: var(--text-primary);
    border: 1px solid var(--border);
    font-size: 11px; font-weight: 600;
  }
  .mat-chip.warn {
    background: rgba(251,191,36,0.10);
    color: var(--warn);
    border-color: rgba(251,191,36,0.3);
  }
  .mat-chip .stock-num {
    font-size: 10px; color: var(--good); font-weight: 700; margin-left: 4px;
  }

  .nozzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .nozzle-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    background: var(--bg-card);
    display: flex; flex-direction: column; gap: 4px;
  }
  .nozzle-card.current {
    border-color: var(--accent);
    background: rgba(239,68,68,0.10);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .nozzle-name { font-weight: 700; font-size: 13px; color: var(--text-primary); }
  .nozzle-desc { font-size: 11px; color: var(--text-secondary); }
  .nozzle-effects { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, monospace; }
  .nozzle-current { font-size: 11px; color: var(--accent); font-weight: 700; margin-top: 4px; }
  .nozzle-buy {
    margin-top: 4px;
    padding: 6px 12px; font-size: 11px; font-weight: 700;
    background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .nozzle-buy:hover:not(:disabled) { background: var(--accent); color: white; border-color: var(--accent); }
  .nozzle-buy:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }

  .sell-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .sell-info { flex: 1; min-width: 0; }
  .sell-price-display { font-size: 32px; font-weight: 800; color: var(--text-primary); line-height: 1; }
  .sell-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .sell-meta .sep { color: var(--border-strong); margin: 0 4px; }
  .sell-meta.muted { color: var(--text-muted); font-size: 11px; }
  .sell-button {
    padding: 12px 26px; font-size: 13px; font-weight: 800;
    background: var(--accent); color: white; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
    flex-shrink: 0; box-shadow: 0 0 12px var(--accent-glow);
  }
  .sell-button:hover:not(:disabled) { background: var(--accent-bright); }
  .sell-button:disabled {
    background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; opacity: 0.5; box-shadow: none;
  }
  .modal-header .subtitle .brand { color: var(--text-muted); font-weight: 500; }

  /* ---- Maintenance UI inside Manage modal ---- */
  .wear-bar-wrap { margin-bottom: 14px; }
  .wear-bar-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; margin-bottom: 4px; color: var(--text-secondary);
  }
  .wear-bar-label .muted { color: var(--text-muted); font-weight: 500; }
  .wear-bar {
    height: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 5px; overflow: hidden;
  }
  .wear-bar-fill { height: 100%; transition: width 0.3s, background 0.3s; }

  .service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  .service-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    background: var(--bg-card);
    display: flex; flex-direction: column; gap: 4px;
  }
  .service-name { font-weight: 700; font-size: 13px; color: var(--text-primary); }
  .service-desc { font-size: 11px; color: var(--text-secondary); }
  .service-effect { font-size: 11px; color: var(--good); font-weight: 600; }
  .service-buy {
    margin-top: 6px;
    padding: 6px 12px; font-size: 11px; font-weight: 700;
    background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .service-buy:hover:not(:disabled) { background: var(--accent); color: white; border-color: var(--accent); }
  .service-buy:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }

  /* ---- Supplies modal — SIMPLE one-row-per-material ---- */
  .supplies-list {
    flex: 1; overflow-y: auto;
    padding: 16px 24px 24px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--bg-base);
  }
  .supplies-row {
    background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 80px 1fr auto;
    align-items: center; gap: 14px;
  }
  .supplies-row.locked { opacity: 0.55; }
  .supplies-row:hover { border-color: var(--accent); }
  .cat-badge {
    text-align: center;
    font-size: 10px; font-weight: 800;
    padding: 6px 8px; border-radius: 8px;
    letter-spacing: 1px;
  }
  .supplies-info { min-width: 0; overflow: hidden; }
  .supplies-line1 .model {
    font-size: 16px; font-weight: 800; color: var(--text-primary);
  }
  .supplies-line2 {
    font-size: 12px; margin-top: 4px;
  }
  .compat-good { color: var(--good); font-weight: 600; }
  .compat-none { color: var(--text-muted); }
  .supplies-line3.note {
    font-size: 11px; color: var(--text-muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .supplies-stock {
    font-size: 11px; color: var(--good); font-weight: 600; margin-top: 4px;
  }
  .supplies-action {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    flex-shrink: 0; min-width: 110px;
  }
  .supplies-price {
    font-size: 18px; font-weight: 800; color: var(--text-primary);
  }
  .supplies-price .muted { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  .supplies-buy {
    padding: 7px 18px; font-size: 11px; font-weight: 700;
    background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .supplies-buy.affordable { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
  .supplies-buy.affordable:hover { background: var(--accent-bright); }
  .supplies-buy:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }

  .inv-supplies-btn {
    margin-top: 6px;
    width: 100%;
    padding: 10px;
    background: var(--accent); color: white; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .inv-supplies-btn:hover { background: var(--accent-bright); }

  /* ---- Order card ---- */
  .order-card {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
    background: var(--bg-card);
    transition: background 0.15s;
  }
  .order-card:hover { background: var(--bg-card-hover); }
  .order-name { font-weight: 700; font-size: 14px; color: var(--text-primary); }
  .order-cat {
    display: inline-block; font-size: 10px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(168,85,247,0.18); color: #c4b5fd; margin-left: 6px; font-weight: 600;
    border: 1px solid rgba(168,85,247,0.3);
  }
  .order-spec { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .order-pay { font-size: 13px; color: var(--good); font-weight: 700; margin-top: 6px; }
  .order-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .order-actions button {
    flex: 1; min-width: 0; padding: 8px 10px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-input); color: var(--text-primary); cursor: pointer; font-family: inherit;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .order-actions button:hover:not(:disabled) { background: var(--accent); color: white; border-color: var(--accent); }
  .order-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .order-actions button.reject { color: var(--accent); flex: 0 0 auto; padding: 8px 12px; }
  .order-actions button.reject:hover:not(:disabled) { background: var(--accent); color: white; border-color: var(--accent); }
  .order-deadline { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .order-deadline.urgent { color: var(--accent); font-weight: 600; }
  .order-reason {
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(239,68,68,0.10);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .orders-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .reject-all-btn {
    padding: 6px 12px;
    background: rgba(239,68,68,0.10);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .reject-all-btn:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* ---- Material list (in inventory sidebar — all 39 materials grouped) ---- */
  .inventory-section #inventory {
    max-height: calc(100vh - 220px);
    overflow-y: auto;
    padding-right: 8px;
    /* Visible scrollbar so users know there's more below the fold */
    scrollbar-width: thin;
    scrollbar-color: var(--accent) var(--bg-input);
  }
  .inventory-section #inventory::-webkit-scrollbar { width: 10px; }
  .inventory-section #inventory::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 5px; }
  .inventory-section #inventory::-webkit-scrollbar-thumb {
    background: var(--accent); border-radius: 5px; border: 2px solid var(--bg-input);
  }
  .inventory-section #inventory::-webkit-scrollbar-thumb:hover { background: var(--accent-bright); }
  .inv-hint {
    font-size: 10px; text-align: center; padding: 6px 0;
    color: var(--accent); font-weight: 700; letter-spacing: 1px;
    opacity: 0.7;
    border-top: 1px dashed var(--border);
    margin-top: 4px;
  }
  .inv-cat-header {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; font-weight: 800;
    color: var(--text-secondary); letter-spacing: 1.5px;
    margin: 14px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .inv-cat-header:first-child { margin-top: 0; }
  .inv-cat-header .inv-cat-count {
    font-size: 9px; color: var(--text-muted); font-weight: 600;
  }
  .mat-card {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: var(--bg-card);
  }
  .mat-card.has-stock { border-color: rgba(16,185,129,0.4); }
  .mat-card.incompat { opacity: 0.55; }
  .mat-info { flex: 1; min-width: 0; }
  .mat-name {
    font-weight: 600; font-size: 12px; color: var(--text-primary);
    display: flex; align-items: center; gap: 6px;
    line-height: 1.2;
  }
  .mat-stock { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .mat-stock .stock-yes { color: var(--good); font-weight: 700; }
  .mat-stock .mat-price { color: var(--text-secondary); }
  .incompat-tag {
    font-size: 8px; font-weight: 700;
    background: rgba(239,68,68,0.12);
    color: #fca5a5;
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid rgba(239,68,68,0.25);
    letter-spacing: 0.5px;
  }
  .mat-buy {
    padding: 5px 9px; font-size: 10px; font-weight: 700;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg-input); color: var(--text-primary); cursor: pointer; font-family: inherit;
    flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .mat-buy:hover:not(:disabled) { background: var(--accent); color: white; border-color: var(--accent); }
  .mat-buy:disabled { opacity: 0.35; cursor: not-allowed; }

  .empty { color: var(--text-muted); font-size: 13px; font-style: italic; padding: 16px 0; text-align: center; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-card); color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }
  .toast.success { background: var(--good); color: #052e16; border-color: var(--good); }
  .toast.error { background: var(--accent); color: white; border-color: var(--accent); }

  /* ---- Shop modal: simple LIST view ---- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: none;
  }
  .modal.open { display: block; }
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .modal-card {
    position: absolute;

<!-- Three.js for 3D printer rendering -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  window.THREE = THREE;
  window.RoundedBoxGeometry = RoundedBoxGeometry;
  window.RoomEnvironment = RoomEnvironment;
  window.dispatchEvent(new Event('threeReady'));
</script>
</head>
<body>
<header>
  <div class="brand">Print3D</div>
  <div class="stats">
    <div><span class="stat-label">Cash</span><span class="stat-money">$<span id="money">0</span></span></div>
    <div><span class="stat-label">Day</span><span id="day">1</span> · <span id="hour">08:00</span></div>
    <div><span class="stat-label">Rep</span><span class="stat-rep" id="rep">0</span></div>
    <div><span class="stat-label">Shipped</span><span id="shipped">0</span></div>
  </div>
  <div class="controls">
    <button id="btnSpeed">1x</button>
    <button id="btnReset" class="danger">Reset</button>
  </div>
</header>
<main>
  <section>
    <h2>
      Workshop <span class="count" id="printerCount"></span>
      <button class="shop-btn" onclick="window.openShop()">+ Buy Printer</button>
    </h2>
    <div id="printers"></div>
  </section>
  <section>
    <h2>Incoming Orders <span class="count" id="orderCount"></span></h2>
    <div id="orders"></div>
  </section>
  <section class="inventory-section">
    <h2>
      Materials <span class="count" id="inventoryTotal">— scrollable</span>
    </h2>
    <div id="inventory"></div>
    <div class="inv-hint">↓ scroll for all categories ↓</div>
  </section>
</main>

<div class="modal" id="manageModal">
  <div class="modal-overlay" onclick="window.closeManage()"></div>
  <div class="modal-card manage-card">
    <div class="modal-header">
      <div>
        <h2>Manage Printer</h2>
        <div class="subtitle" id="manageSubtitle">—</div>
      </div>
      <button class="close" onclick="window.closeManage()">×</button>
    </div>
    <div class="manage-body" id="manageBody"></div>
  </div>
</div>

<div class="modal" id="shopModal">
  <div class="modal-overlay" onclick="window.closeShop()"></div>
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2>Printer Shop</h2>
        <div class="subtitle">Real machines, real prices</div>
      </div>
      <button class="close" onclick="window.closeShop()">×</button>
    </div>
    <div class="shop-filters" id="shopFilters">
      <button class="active" data-filter="all" onclick="window.setShopFilter('all')">All</button>
      <button data-filter="garage" onclick="window.setShopFilter('garage')">Garage</button>
      <button data-filter="hobbyist" onclick="window.setShopFilter('hobbyist')">Hobbyist</button>
      <button data-filter="studio" onclick="window.setShopFilter('studio')">Studio</button>
      <button data-filter="pro" onclick="window.setShopFilter('pro')">Pro</button>
      <button data-filter="industrial" onclick="window.setShopFilter('industrial')">Industrial</button>
      <button data-filter="endgame" onclick="window.setShopFilter('endgame')">Endgame</button>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="game.js"></script>
</body>
</html>
